# Deploys the Worker with Wrangler. Merging is not releasing — main goes to
# staging, and production only moves when someone promotes a commit to it:
# - push on main  → staging: a version uploaded under the `staging` alias
#   (staging-plein.<subdomain>.workers.dev). It serves no production traffic.
# - manual run    → production (custom domain plein.zadkiel.fr): Actions →
#   Deploy → Run workflow, with the commit to promote in `ref` (default: the
#   tip of main). An older commit is a rollback — same button. The commit has
#   to be on main: what reaches production went through staging first.
# - pull requests → preview version (URL pr-<n>-plein.<subdomain>.workers.dev),
#   posted as a PR comment.
# - closed PRs    → their preview versions are deleted by deploy-cleanup.yml,
#   which stays a workflow apart so its run can't cancel a deploy.
#
# Staging and the previews are versions of the SAME Worker as production
# (`preview_urls: true` in wrangler.jsonc): nothing to provision, and a version
# only takes production traffic through `wrangler deploy`, which the promotion
# job alone runs. What is live where shows under the repository's Environments.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id (dashboard → Workers & Pages)
#
# Actions are pinned by commit SHA (tag in comment).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to put in production — a SHA, a tag or a branch. It must be on main.
        required: true
        default: main

permissions:
  contents: read

# Concurrency is per job, not per workflow: a staging upload and a promotion
# both run on main, and in one shared group a queued promotion would be dropped
# by the next merge.
jobs:
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Queued, never cancelled mid-upload; of several waiting, the newest wins.
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload the staging version
        id: upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stable alias → staging-plein.<subdomain>.workers.dev
          command: versions upload --preview-alias staging --tag ${{ github.sha }}
      - name: Report the staging URL
        id: url
        env:
          COMMAND_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          url=$(grep -oE 'https://staging-[^[:space:])]*workers\.dev' <<<"$COMMAND_OUTPUT" | head -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging is on \`${GITHUB_SHA::7}\`"
            echo
            echo "${url:-No alias URL found in the wrangler output — check the upload step.}"
            echo
            echo "Promote it: Actions → Deploy → Run workflow, \`ref\` = \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Never cancel a production deploy mid-flight.
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://plein.zadkiel.fr
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the promoted commit is resolved and checked against
          # main below, and it may be any age.
          fetch-depth: 0
      - name: Check out the promoted commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse --verify --quiet "origin/$REF^{commit}" \
            || git rev-parse --verify --quiet "$REF^{commit}") || {
            echo "::error::'$REF' is not a commit, tag or branch of this repository"
            exit 1
          }
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main — only merged commits are promoted"
            exit 1
          fi
          git checkout --detach "$sha"
          {
            echo "### Promoting \`${sha::7}\` to production"
            echo
            git log -1 --format='%s (%cs)' "$sha"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-preview:
    # Forked PRs don't get secrets — only same-repo PRs deploy a preview.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # A superseded preview can be cancelled: the next push uploads its own.
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stable per-PR alias → pr-<n>-plein.<subdomain>.workers.dev
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Comment the preview URL on the PR
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const marker = '<!-- plein-preview-url -->';
            const alias = `pr-${context.issue.number}`;
            // wrangler prints both the version URL (<hash>-plein…) and, with
            // --preview-alias, the stable alias URL (pr-<n>-plein…).
            const printed = (process.env.COMMAND_OUTPUT || '')
              .match(/https:\/\/[^\s)]*workers\.dev[^\s)]*/g) || [];
            const isAlias = (u) => u.startsWith(`https://${alias}-`);
            let versionUrl = process.env.DEPLOYMENT_URL || '';
            if (!versionUrl) versionUrl = printed.filter((u) => !isAlias(u)).pop() || '';
            // Fallback: the alias URL is the version URL with its hash label swapped.
            let aliasUrl = printed.find(isAlias) || '';
            if (!aliasUrl && versionUrl) {
              aliasUrl = versionUrl.replace(/^https:\/\/[^-.]+/, `https://${alias}`);
            }
            // Plain links: GitHub's comment sanitizer drops `target` from <a>,
            // so a new tab can't be forced from here.
            const lines = [];
            if (versionUrl) lines.push(`🚀 **Preview of this commit**: ${versionUrl}`);
            if (aliasUrl) lines.push(`🔗 **Stable branch endpoint**: ${aliasUrl}`);
            const body = lines.length
              ? `${marker}\n${lines.join('\n\n')}\n\n_Version alias \`${alias}\` · commit ${context.payload.pull_request.head.sha.slice(0, 7)}_`
              : `${marker}\n⚠️ Preview uploaded but no URL found in the wrangler output — check the job logs.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            // Delete-and-recreate (rather than update in place) so the comment
            // always sits below the latest commits in the PR timeline.
            const stale = comments.filter(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );
            for (const c of stale) {
              await github.rest.issues.deleteComment({ ...context.repo, comment_id: c.id });
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
