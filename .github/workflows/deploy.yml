# Deploys the Worker with Wrangler:
# - push on main  → production deploy (custom domain plein.zadkiel.fr)
# - pull requests → preview version (URL pr-<n>-plein.<subdomain>.workers.dev,
#   requires `preview_urls: true` in wrangler.jsonc), posted as a PR comment.
# - closed PRs    → the preview versions are deleted, so aliases don't pile up.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id (dashboard → Workers & Pages)
#
# Actions are pinned by commit SHA (tag in comment).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    # `closed` is not a default type; it drives the preview cleanup job below.
    types: [opened, synchronize, reopened, closed]
  # Manual re-deploy of production (Actions → Deploy → Run workflow), for the
  # rare cases where an event is lost or a deploy must be re-kicked as-is.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a production deploy mid-flight; superseded PR previews can be.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-preview:
    # Forked PRs don't get secrets — only same-repo PRs deploy a preview.
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stable per-PR alias → pr-<n>-plein.<subdomain>.workers.dev
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Comment the preview URL on the PR
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const marker = '<!-- plein-preview-url -->';
            const alias = `pr-${context.issue.number}`;
            // wrangler prints both the version URL (<hash>-plein…) and, with
            // --preview-alias, the stable alias URL (pr-<n>-plein…).
            const printed = (process.env.COMMAND_OUTPUT || '')
              .match(/https:\/\/[^\s)]*workers\.dev[^\s)]*/g) || [];
            const isAlias = (u) => u.startsWith(`https://${alias}-`);
            let versionUrl = process.env.DEPLOYMENT_URL || '';
            if (!versionUrl) versionUrl = printed.filter((u) => !isAlias(u)).pop() || '';
            // Fallback: the alias URL is the version URL with its hash label swapped.
            let aliasUrl = printed.find(isAlias) || '';
            if (!aliasUrl && versionUrl) {
              aliasUrl = versionUrl.replace(/^https:\/\/[^-.]+/, `https://${alias}`);
            }
            // Plain links: GitHub's comment sanitizer drops `target` from <a>,
            // so a new tab can't be forced from here.
            const lines = [];
            if (versionUrl) lines.push(`🚀 **Preview of this commit**: ${versionUrl}`);
            if (aliasUrl) lines.push(`🔗 **Stable branch endpoint**: ${aliasUrl}`);
            const body = lines.length
              ? `${marker}\n${lines.join('\n\n')}\n\n_Version alias \`${alias}\` · commit ${context.payload.pull_request.head.sha.slice(0, 7)}_`
              : `${marker}\n⚠️ Preview uploaded but no URL found in the wrangler output — check the job logs.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            // Delete-and-recreate (rather than update in place) so the comment
            // always sits below the latest commits in the PR timeline.
            const stale = comments.filter(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );
            for (const c of stale) {
              await github.rest.issues.deleteComment({ ...context.repo, comment_id: c.id });
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  cleanup-preview:
    # Merged or abandoned, a closed PR keeps no preview. Wrangler cannot delete
    # an alias, so we delete the versions carrying it through the Workers API.
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Delete the preview versions and their PR comment
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          script: |
            // Must match `name` in wrangler.jsonc.
            const worker = 'plein';
            const alias = `pr-${context.issue.number}`;
            const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers`;
            const cf = async (path, method = 'GET') => {
              const res = await fetch(`${base}/${path}`, {
                method,
                headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              });
              return res.json();
            };

            // A version that is (or was) deployed stays, whatever alias it carries:
            // deleting one would break production or the ability to roll back to it.
            const deployments = await cf(`scripts/${worker}/deployments`);
            const deployed = new Set(
              (deployments.result?.deployments ?? []).flatMap((d) =>
                d.versions.map((v) => v.version_id),
              ),
            );

            const doomed = [];
            for (let page = 1; page <= 20; page++) {
              const { result } = await cf(`workers/${worker}/versions?per_page=100&page=${page}`);
              if (!result?.length) break;
              for (const v of result) {
                if (v.annotations?.['workers/alias'] === alias && !deployed.has(v.id)) {
                  doomed.push(v.id);
                }
              }
            }

            let deleted = 0;
            for (const id of doomed) {
              const res = await cf(`workers/${worker}/versions/${id}`, 'DELETE');
              if (res.success) deleted += 1;
              else core.warning(`${id}: ${JSON.stringify(res.errors)}`);
            }
            core.info(`${alias}: deleted ${deleted}/${doomed.length} preview version(s)`);

            // The URL it advertised is dead, so the comment is now misleading.
            const marker = '<!-- plein-preview-url -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const stale = comments.filter(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );
            for (const c of stale) {
              await github.rest.issues.deleteComment({ ...context.repo, comment_id: c.id });
            }
