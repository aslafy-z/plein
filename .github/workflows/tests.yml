# Runs the test suites:
# - unit: paraglide message compile + tsc typecheck + Vitest (src/**/*.test.ts)
#         — fast, no browser
# - e2e:  Playwright suite (e2e/, playwright.config.ts) against the Vite dev
#         server (started automatically by Playwright's webServer) with the
#         deterministic demo data source, split across shards (one runner each)
# on:
# - pull requests   → every push to a PR branch
# - push on main    → guards what actually deploys
#
# Actions are pinned by commit SHA (tag in comment).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compiles messages/{locale}.json into src/paraglide (gitignored). Both
      # scripts below also run it via `pre*`, so this only makes the step
      # visible in the log when the catalog is what broke.
      - run: npm run build:messages
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sharded across runners rather than crammed into more workers on one:
    # Playwright defaults to cores/2 (= 2 on a 4-vCPU runner) and this suite
    # measures animations and map settle times, so extra workers on the same
    # cores buy speed with flakiness. Each shard gets its own machine.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:messages
      # The browser build is ~170 MB of downloads per shard, and it only
      # changes when Playwright does: keyed on the installed version, so a
      # dependency bump misses the cache and downloads the matching build.
      # Three shards starting cold all try to save the same key; one wins and
      # the others log a warning, which is harmless.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Not cacheable the same way: these are apt packages (fonts), installed
      # into the runner itself, and the suite's text measurements depend on
      # them being there.
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
      - name: Run e2e tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
