<!doctype html>
<!-- Base locale. main.tsx overwrites `lang` (and the title) with the
     resolved one before the first paint — see src/lib/locale.ts. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101214" />
    <!-- Resolve the theme BEFORE first paint: the persisted choice if there is
         one, the browser's preference otherwise. The palette in styles.css
         keys on this attribute; src/lib/colorScheme.ts keeps it live after
         boot (and keeps the theme-color meta above in step). -->
    <script>
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem('plein.settings.v1') || '{}').theme;
        } catch (e) {
          /* unreadable blob — fall through to the browser preference */
        }
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="description" content="Plein. — Payez votre plein au juste prix. Les prix des stations-service en France, en Espagne, en Andorre, au Portugal et en Allemagne, comparés autour de vous et sur vos trajets." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" href="/fonts/archivo-latin-v25.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/spline-sans-mono-latin-v13.woff2" as="font" type="font/woff2" crossorigin />
    <title>Plein. — le plein au juste prix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
